name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan folder www
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' --exclude='resources' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
      - run: npm install
      - run: npx cap add android
      - name: Buat ikon aplikasi
        run: |
          if [ -f resources/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JII-Santri-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
